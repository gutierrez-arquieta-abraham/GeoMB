# Bloque a agregar DENTRO del server{} HTTPS existente de geomb.duckdns.org en el EC2 (el
# mismo dominio que ya sirve metrobus_app) -- no crea un server{} nuevo ni un subdominio.
# Expone el asistente en https://geomb.duckdns.org/gemini/...
#
# El uvicorn de systemd (geomb-gemini.service) solo escucha en 127.0.0.1:8005, nunca en una
# interfaz pública: todo el tráfico externo pasa por este proxy (que ya tiene TLS terminado
# por el server{} existente).

location /gemini/ {
    proxy_pass http://127.0.0.1:8005/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # El ciclo de Function Calling hace varias vueltas a Gemini antes de responder al
    # cliente; con timeouts por defecto (~60s en muchas distros, a veces menos) un mensaje
    # que dispara 2-3 llamadas a herramientas puede cortarse a mitad de camino.
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
